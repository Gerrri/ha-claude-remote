name: Claude Remote Control for Home Assistant (unofficial)
version: "0.4.0"
slug: claude_remote
description: Claude Code Remote Control with ha-mcp, steerable from the Claude app
url: https://github.com/Gerrri/ha-claude-remote
arch:
  - aarch64
  - amd64
init: false
boot: manual
# Time for Remote Control to stop its sessions and report offline (cont-finish.d)
timeout: 60
stage: experimental
homeassistant_api: true
# Host name instead of the random container name: Remote Control shows it as the machine name
host_uts: true
ingress: true
panel_icon: mdi:robot-outline
panel_title: Claude Remote
# Claude login, transcripts and settings live in /data/claude
backup_exclude:
  - claude
options:
  session_name: home-assistant
  idle_timeout_min: 60
  max_runtime_min: 0
  permission_mode: default
  max_sessions: 1
  max_memory_mb: 1024
  min_free_mb: 150
  enable_ha_mcp: true
  ha_mcp_transport: http
  enable_rtk: true
  extra_mcp_servers: []
schema:
  session_name: str
  idle_timeout_min: int(0,)
  max_runtime_min: int(0,)
  permission_mode: list(default|acceptEdits|plan)
  model: str?
  language: str?
  max_sessions: int(1,4)
  max_memory_mb: int(512,)
  min_free_mb: int(0,)
  enable_ha_mcp: bool
  ha_mcp_transport: list(http|stdio)
  enable_rtk: bool
  extra_mcp_servers:
    - name: match(^[A-Za-z0-9_-]+$)
      json: str
